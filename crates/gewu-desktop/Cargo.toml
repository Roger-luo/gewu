[package]
name = "gewu-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri shell for the Gewu desktop review UI"
default-run = "gewu-desktop"

[[bin]]
name = "gewu-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
gewu-agent = { path = "../gewu-agent" }
gewu-app = { path = "../gewu-app" }
gewu-workbench = { path = "../gewu-workbench" }
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.5", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
