[package]
name = "gewu-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP bridge for the Gewu app protocol"

[dependencies]
gewu-app = { path = "../gewu-app" }
gewu-workbench = { path = "../gewu-workbench" }
serde = { version = "1.0.229", features = ["derive"] }
