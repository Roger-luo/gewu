[package]
name = "gewu-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ACP client that runs a coding agent through the Gewu harness"

[dependencies]
agent-client-protocol = { version = "5.0.0", features = ["process"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
