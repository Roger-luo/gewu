[package]
name = "gewu-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI runtime for Gewu"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
gewu-decide = { version = "0.1.0", path = "../gewu-decide" }
gewu-git = { version = "0.1.0", path = "../gewu-git" }
gewu-harness = { version = "0.1.0", path = "../gewu-harness" }
gewu-http = { version = "0.1.0", path = "../gewu-http" }
gewu-workbench = { path = "../gewu-workbench" }
gewu-review = { version = "0.1.0", path = "../gewu-review" }
gewu-tui = { version = "0.1.0", path = "../gewu-tui" }
hex = "0.4.3"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1"

[dev-dependencies]
tempfile = "3.27.0"
