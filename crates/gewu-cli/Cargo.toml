[package]
name = "gewu-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI runtime for Gewu"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
gewu-review = { version = "0.1.0", path = "../gewu-review" }
pulldown-cmark = "0.13.4"
serde = "1.0.229"
serde_json = "1.0.151"
syntect = "5.3.0"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
