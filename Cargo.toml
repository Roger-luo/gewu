[workspace]
members = [".", "crates/gewu-cli", "crates/gewu-review"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[package]
name = "gewu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Human-guided code and design review"

[dependencies]
gewu-cli = { path = "crates/gewu-cli" }
gewu-review = { path = "crates/gewu-review" }
